version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(frontend)"
    groups:
      vue-stack:
        patterns:
          - vue
          - vue-tsc
          - "@vitejs/*"
          - vite
          - vitest
      electron-stack:
        patterns:
          - electron
          - electron-builder

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
