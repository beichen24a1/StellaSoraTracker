[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellasora-toolkit"
version = "1.3.3b1"
description = "Read-only StellaSora gacha and character emblem exporter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]
license = { file = "LICENSE" }

[project.scripts]
stellasora-export = "stellasora_toolkit.cli:main"
stellasora-toolkit = "stellasora_toolkit.desktop_launcher:main"

[project.optional-dependencies]
dev = ["PyInstaller>=6"]

[tool.setuptools.packages.find]
include = ["stellasora_toolkit*"]
